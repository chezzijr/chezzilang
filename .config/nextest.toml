# cargo-nextest config (2026-09-30). Runs every test binary IN PARALLEL, one process per test,
# instead of `cargo test`'s one-binary-after-another. The scheduler/timing targets below share
# the box badly (every M:N test spawns its own worker pool), so they run in the capped `timing` group.
# Sampled n=5 on main (2026-09-30): 146-211 s vs `cargo test` 764-800 s, same red rate (2/5 each; the
# replay test that was red then is byte-for-byte since TICKET-205).
# `timing` at 1 thread made the group itself the bottleneck (~500 s); 4 matches cargo test's in-binary parallelism.
# deadlock_halt_single_judge, executor_job_owner and executor_reentrant_shutdown joined the group on
# 2026-10-17: they are scheduler binaries, and each one failed at verifying under parallel worktree load
# (TICKET-246, 254 and 221-227). The group lowers their load and retries nothing.

[profile.default]
test-threads = 8
# The 300 s limit (60 s x 5) stops a hung test; nextest prints SLOW for a test past 60 s. A test
# finishes well under 100 s (a third of it): split a slow grid with grid_tests!
# (tests/support/grid_tests.rs), never raise this limit or add an override
# (docs/contributing/dev-commands.md, TICKET-276).
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

[test-groups]
timing = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(chezzi_threads_cli) | binary(blocking_context_grid) | binary(channel_handoff_grid) | binary(examples_golden) | binary(native_callback_stdin_read_frees_width) | binary(mn_pool_ignores_cpu_quota_hangs) | binary(sched_seed_cli) | binary(chezzi_nested_nursery_deadlock) | binary(deadlock_verdict_misses) | binary(chz_suite) | binary(deadlock_halt_single_judge) | binary(executor_job_owner) | binary(executor_reentrant_shutdown)'
test-group = 'timing'
