[package]
name = "chezzi"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.186"
libffi = "3"
libloading = "0.8"
polling = "3"
regex = "1"
socket2 = "0.5"
ureq = { version = "2", features = ["tls"] }
# Editor LSP server deps — OPTIONAL, gated behind the `lsp` feature so neither the dependency tree nor
# the `chezzi-lsp` bin is part of the default `cargo build`/`cargo test`. tower-lsp pulls in tokio (an
# async runtime is unavoidable for an stdio JSON-RPC server), so both are gated together.
tower-lsp = { version = "0.20", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"], optional = true }

[features]
# Build the LSP server: `cargo build --features lsp --bin chezzi-lsp`.
lsp = ["dep:tower-lsp", "dep:tokio"]

# The LSP server binary is excluded from the default build — it needs the `lsp` feature's heavy async
# deps. The editor *logic* lives in `src/editor` (dep-free) and is always built + tested.
[[bin]]
name = "chezzi-lsp"
path = "src/bin/chezzi-lsp.rs"
required-features = ["lsp"]

[dev-dependencies]
bnf = "0.6.0"
cc = "1"

# Build-time tuning for the dev/test cycle. Default cargo dev profile emits FULL debuginfo (`debug=2`),
# which is slow to generate and link on a crate this size and is rebuilt on every `cargo test`. Keep
# only line tables (panics still report file:line) and split debuginfo so the linker does less work.
# Release is untouched — the VM is only fast when release-optimized (see CLAUDE.md / docs/benchmarks).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
